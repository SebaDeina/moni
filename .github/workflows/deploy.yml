name: Deploy

# Solo manual: producción cambia cuando Seba lo decide (botón "Run workflow" o deploy/moni.sh deploy).
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Desplegar en moni.nimbodata.com
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy "moni-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Verificar HTTPS
        run: curl -fsS --retry 5 --retry-delay 3 https://moni.nimbodata.com/health
